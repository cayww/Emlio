workflows:
  ios-swiftui-release:
    name: Emlio
    max_build_duration: 120
    environment:
      vars:
        FL_OUTPUT_DIR: build/ios/ipa
      xcode: "26.2.0" # 对应你的 Xcode 版本
    scripts:
      - name: Clean Build Folder
        script: |
          echo "🧹 清理旧的构建缓存"
          xcodebuild clean -project Emlio.xcodeproj -scheme Emlio -configuration Release

      - name: Build IPA for App Store
        script: |
          echo "🔧 构建 IPA（App Store 发布）"
          set -e
          mkdir -p $FL_OUTPUT_DIR

          # 自动获取最新 TestFlight build number +1
          LATEST_BUILD_NUMBER=$(fastlane run get_latest_testflight_build_number app_identifier:"com.asjhdsf.emlio" | grep "The latest build number" | awk '{print $NF}')
          BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))
          echo "使用 build number: $BUILD_NUMBER"

          # 构建 archive
          xcodebuild archive \
            -project Emlio.xcodeproj \
            -scheme Emlio \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath $FL_OUTPUT_DIR/Emlio.xcarchive \
            CODE_SIGN_STYLE=Automatic \
            SKIP_INSTALL=NO \
            BUILD_LIBRARIES_FOR_DISTRIBUTION=YES \
            BUILD_NUMBER=$BUILD_NUMBER

          # 导出 IPA 用于 App Store
          xcodebuild -exportArchive \
            -archivePath $FL_OUTPUT_DIR/Emlio.xcarchive \
            -exportPath $FL_OUTPUT_DIR \
            -exportOptionsPlist <(cat <<EOF
            {
              "method": "app-store",
              "signingStyle": "automatic",
              "compileBitcode": true,
              "stripSwiftSymbols": true
            }
            EOF
            )

      - name: Upload to TestFlight / App Store Connect
        script: |
          echo "📤 上传到 TestFlight / App Store (API Key)"
          gem install fastlane --no-document

          # 自动上传并使用 Codemagic 注入的 API Key
          fastlane pilot upload \
            -i $FL_OUTPUT_DIR/Emlio.ipa \
            --skip_waiting_for_build_processing true \
            --api_key_path $APP_STORE_CONNECT_PRIVATE_KEY

    artifacts:
      - build/ios/ipa/*.ipa
